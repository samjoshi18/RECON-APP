# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Reviewer guidance for recon-app. Non-imperative phrasing throughout —
# the reviewer may consult MCP tools but is never ordered to.
reviews:
  collapse_walkthrough: false
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/recon-output/**"
  path_instructions:
    - path: "**/*"
      instructions: >
        Focus on correctness, security, and performance.

    - path: "backend/src/server.ts"
      instructions: >
        When reviewing changes to API route handlers in this file, the
        reviewer may consult the project's registered MCP tools to verify
        that response parsing still matches the upstream provider contracts
        (VirusTotal v3, Google Safe Browsing v4, LeakCheck v2, NVD).
        This is optional context-gathering, not a required step.

    - path: "config/deployment-context.json"
      instructions: >
        Changes to deployment context may affect cloud posture assumptions.
        The verify_cloud_posture MCP tool returns the current baseline if
        the reviewer wants to confirm consistency.

    - path: "backend/src/recon-helpers.ts"
      instructions: >
        When reviewing shared provider-response helpers, the reviewer may
        consult the reputation_lookup and cloud_bucket_inventory MCP tools
        to confirm the helper output matches the documented provider schemas.

  auto_review:
    base_branches:
      - main

  tools:
    fbinfer:
      enabled: false
    presidio:
      enabled: false

knowledge_base:
  mcp:
    enabled: true
